name: OA-CXR reproducibility
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[training,dev,download]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/public/download.py --output weights
      - run: python scripts/public/smoke_model.py --weights weights/main
